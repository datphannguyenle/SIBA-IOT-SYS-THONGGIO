<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIBA · Thông gió · Modular demo</title>
<link rel="stylesheet" href="modular.css">
<style>
html,body{margin:0;height:100%;font:14px Arial;background:#001827;color:#f0f5ff}
.preview-top{height:76px;background:#009799;display:flex;align-items:center;padding:0 22px;gap:30px;box-sizing:border-box}
.preview-top strong{font-size:28px}.preview-top span{margin-left:auto}.preview-side{position:fixed;top:76px;left:0;bottom:0;width:240px;background:#f3f7f8;color:#214153;padding:20px;box-sizing:border-box}
.preview-side p{padding:12px 8px}.preview-main{margin-left:240px;height:calc(100vh - 76px);overflow:auto}
.preview-toolbar{height:48px;background:#009799;display:flex;align-items:center;padding:0 16px;justify-content:space-between}
.preview-controls{display:flex;gap:8px;font-size:12px}.preview-controls select{max-width:165px}
#modular-grid{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));grid-auto-rows:24px;gap:6px;padding:6px}
.preview-widget{min-width:0;min-height:0;overflow:hidden}.preview-widget>.vent-modular-root{height:100%;overflow:auto;box-sizing:border-box}
[hidden]{display:none!important}
@media(max-width:800px){.preview-side{display:none}.preview-main{margin-left:0}.preview-top{height:56px}.preview-main{height:calc(100vh - 56px)}.preview-top strong{font-size:20px}.preview-top span{display:none}.preview-widget{grid-column:1 / -1!important;grid-row:auto!important;min-height:140px}#modular-grid{display:flex;flex-direction:column}.preview-widget>.vent-modular-root{height:auto;max-height:720px}.preview-controls{flex-wrap:wrap}}
</style></head><body>
<header class="preview-top"><strong>SIBA GROUP</strong><b>NỀN TẢNG IoT</b><span>Khung kiểm thử · không phải dữ liệu PLC</span></header>
<aside class="preview-side"><p>Trang chủ</p><p>Cảnh báo</p><p>▦ Dashboards</p><p>Thiết bị</p><p>Tài sản</p><p>Khách hàng</p></aside>
<main class="preview-main"><div class="preview-toolbar"><span>Thông gió · kiểm thử</span><label class="preview-controls">Nguồn kiểm thử <select id="test-source"><option value="demo">DEMO · đủ trạng thái</option><option value="empty">LIVE · chưa có dữ liệu</option><option value="subscription">LIVE · ctx.data giả</option></select></label></div><div id="modular-grid"></div></main>
<script src="../widgets/ventilation-contract-v03.js"></script><script src="../widgets/ventilation-adapter.js"></script><script src="../widgets/ventilation-source.js"></script><script src="modular.js"></script><script src="modular-preview.js"></script>
</body></html>
